# Evolution params
evolution_params:
  n_generations: 10
  population_size: 10
  remove_population_pct: 0.0
  n_elites: 0
  mutation_rate: 0.1
  mutation_factor: 0.1
  save_path: results/constraint-dummy

device: mps
batch_size: 64
n_jobs: 1

model_params:
  - type: linear
    in_features: 2
    out_features: 64
  - type: tanh
  - type: linear
    in_features: 64
    out_features: 1
  - type: sigmoid

context:
  - Carbon tax initial target

actions:
  - Carbon tax initial target

outcomes:
  Temperature change from 1850: true
  Max cost of energy: true
